<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- F letter with waveform logo -->
  
  <!-- Dark F background -->
  <rect x="30" y="45" width="35" height="110" fill="#2d3748"/>
  
  <!-- Top horizontal bar of F -->
  <rect x="30" y="45" width="75" height="28" fill="#2d3748"/>
  
  <!-- Middle horizontal bar of F -->
  <rect x="30" y="100" width="55" height="22" fill="#2d3748"/>
  
  <!-- Waveform lines -->
  <g stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left wave pattern -->
    <path d="M 95 75 Q 105 65 115 75 Q 125 85 135 75"/>
    <path d="M 95 92 Q 105 80 115 92 Q 125 104 135 92"/>
    <path d="M 95 109 Q 105 99 115 109 Q 125 119 135 109"/>
    
    <!-- Center wave pattern (taller/more prominent) -->
    <path d="M 135 60 Q 150 45 165 60 Q 180 75 165 90"/>
    <path d="M 135 77 Q 150 62 165 77 Q 180 92 165 107"/>
    <path d="M 135 94 Q 150 79 165 94 Q 180 109 165 124"/>
    
    <!-- Right wave pattern -->
    <path d="M 163 75 Q 173 65 183 75 Q 188 80 188 85"/>
    <path d="M 163 92 Q 173 80 183 92 Q 188 99 188 105"/>
    <path d="M 163 109 Q 173 99 183 109 Q 188 117 188 122"/>
  </g>
</svg>