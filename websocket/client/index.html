<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
</head>

<body>
<div id="header">
  <div class="header-left">Friday</div>
</div>

<div id="content">
  <div class="friday-main">
    <!-- Status Indicator with Glowing Dot -->
    <div class="status-wrapper">
      <span id="status-dot" class="status-dot offline"></span>
      <span id="connection-status" class="status-text">Disconnected</span>
    </div>

    <!-- Seamless Visualizer with Ambient Glow -->
    <div class="visualizer-wrapper">
      <div id="ambient-glow" class="ambient-glow"></div>
      <div class="aurora-waveform">
        <canvas id="waveCanvas"></canvas>
        <div id="voice-orb" class="voice-orb"></div>
      </div>
    </div>

    <!-- Subtitles -->
    <div id="subtitle-container">
      <div id="subtitle-text"></div>
    </div>

    <!-- Dynamic Controls -->
    <div class="controls-wrapper">
      <button id="toggle-btn" class="action-btn btn-connect">Wake Friday</button>
    </div>
  </div>
</div>

<div class="particle-layer" id="particleLayer"></div>
<div class="background-layer"></div>

<script type="module" src="/src/app.ts"></script>
<link rel="stylesheet" href="/src/style.css">
</body>

</html>
