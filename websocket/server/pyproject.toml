[project]
name = "friday-server"
version = "1.0.0"
description = "Friday AI Agent - Premium Real-time Voice Assistant"
authors = [
    {name = "Sanket Patel", email = "your-email@example.com"}
]
requires-python = ">=3.11"
license = {text = "BSD-2-Clause"}
readme = "README.md"
repository = "https://github.com/Sanketh-Patil09/friday-ai-agent"
keywords = ["ai", "voice-agent", "pipecat", "groq", "deepgram", "elevenlabs"]

dependencies = [
    "python-dotenv",
    "uvicorn",
    "fastapi",
    "pipecat-ai[silero,websocket,google]>=0.0.102",
    "requests",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
